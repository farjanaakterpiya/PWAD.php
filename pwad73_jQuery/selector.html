<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <h1>This is heading with h1</h1>
    <h2>This is heading with h2</h2>
    <p>This is first paragraph</p>
    <ul>
        <li>Belly</li>
        <li>Chameli</li>
        <li>Waterlily</li>
        <li>Rose</li>
    </ul>
    <button class="btn1">Hide all </button>
    <button class="btn2">Hide paragraph </button>
    <button class="btn3">Hide Item </button>
    <script>
        $(document).ready(function(){
            $(".btn1").click(function(){
                $("*").hide();
            });
            
                $(".btn2").click(function(){
                    $("h1").hide();
                });
                $(".btn3").click(function(){
                    $("p").hide();
                })
            
        });
    </script>
</body>
</html>
